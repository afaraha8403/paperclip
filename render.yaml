# render.yaml — required for deploy. Keep in your fork.
databases:
  - name: paperclip-db
    plan: free
    region: oregon

services:
  - type: web
    runtime: node
    name: paperclip
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @paperclipai/ui build && pnpm --filter @paperclipai/server build
    startCommand: node server/dist/index.js
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: SERVE_UI
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: paperclip-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: PAPERCLIP_PUBLIC_URL
        sync: false
      - key: PAPERCLIP_DEPLOYMENT_MODE
        value: authenticated
      - key: PAPERCLIP_DEPLOYMENT_EXPOSURE
        value: private
